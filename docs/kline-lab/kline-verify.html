<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>KLineChart 缠论叠加层可行性验证</title>
<style>
  body { margin:0; padding:16px; background:#0B1220; color:#E6EDF3; font:13px/1.6 ui-sans-serif,system-ui,"Microsoft YaHei"; }
  h1 { font-size:16px; margin:0 0 8px; }
  #chart { width:1200px; height:640px; background:#0F172A; }
  #out { margin-top:12px; white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas; font-size:12px; }
  .pass { color:#4ADE80; } .fail { color:#F87171; } .warn { color:#FBBF24; }
  #hint { color:#94A3B8; }
</style>
</head>
<body>
<h1>KLineChart v10.0.3 —— 缠论叠加层可行性验证（go / no-go 闸门）</h1>
<div id="chart"></div>
<div id="out"><span id="hint">running...</span></div>

<!-- 依赖仓库内已安装的 klinecharts UMD 产物; 若 node_modules 缺失先 pnpm add klinecharts@10.0.3 -->
<script src="../../frontend/node_modules/klinecharts/dist/umd/klinecharts.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
 * 验证目标（对应 docs/chan-migration-plan.md 第五节「仍需 1 天最小验证的三件事」）
 *   Q1: 只给 1 个锚点(points.length===1)时 createPointFigures 是否被调用
 *   Q2: chart.convertToPixel 换算在缩放/平移后是否仍正确
 *   Q3: 叠加层画的水平线/色块会不会撑开 y 轴范围（ECharts 三坑第 2 条）
 * 附加:
 *   Q4: removeOverlay + 重新 createOverlay（切股/切周期）是否干净
 *   Q5: 单 overlay 承载 ~40 笔 + ~10 中枢 + ~20 买卖点时的单帧绘制耗时
 *   Q6: 端点落在可视区外时 convertToPixel 的返回值（决定要不要自己裁剪）
 *   Q7: x 轴是否为**等距索引轴**（决定 ECharts 的「逐 bar 线性插值」与 KLineChart 的
 *       「两端点直线」是否几何等价 —— 这是 P1 对拍能否成立的前提）
 * ------------------------------------------------------------------------- */
const KC = window.klinecharts
const R = { version: (typeof KC.version === 'function' ? KC.version() : KC.version), checks: {}, data: {}, errs: [] }
const CANDLE = 'candle_pane'
const UP = '#F6465D'    // 红涨
const DOWN = '#2EBD85'  // 绿跌

const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))
const sleep = ms => new Promise(r => setTimeout(r, ms))
const r2 = v => (typeof v === 'number' && isFinite(v)) ? Math.round(v * 100) / 100 : v

/* ---------- 1. 合成数据（确定性 PRNG，保证可复跑） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0
    let t = Math.imul(a ^ a >>> 15, 1 | a)
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t
    return ((t ^ t >>> 14) >>> 0) / 4294967296
  }
}
const N = 400
const DAY = 86400000
const T0 = Date.UTC(2024, 0, 1)
const data = []
{
  const rnd = mulberry32(20260924)
  let px = 20
  for (let i = 0; i < N; i++) {
    const drift = (rnd() - 0.48) * 0.6
    const open = px
    const close = px * (1 + drift / 100)
    const high = Math.max(open, close) * (1 + rnd() * 0.012)
    const low = Math.min(open, close) * (1 - rnd() * 0.012)
    data.push({
      timestamp: T0 + i * DAY,
      open: +open.toFixed(2), high: +high.toFixed(2),
      low: +low.toFixed(2), close: +close.toFixed(2),
      volume: Math.round(1e6 * (0.5 + rnd())),
    })
    px = close
  }
}
R.data.bars = data.length
R.data.pxMin = Math.min(...data.map(d => d.low)).toFixed(2)
R.data.pxMax = Math.max(...data.map(d => d.high)).toFixed(2)

/* ---------- 2. 合成缠论图层（笔 / 中枢 / 买卖点） ---------- */
// 简单 zigzag: 每 12~20 根取一个拐点，交替方向，连成笔
function buildChanLayers(bars) {
  const rnd = mulberry32(777)
  const pivots = []
  let i = 0, up = true
  while (i < bars.length - 1) {
    const seg = bars.slice(i, i + 12 + Math.floor(rnd() * 9))
    if (seg.length < 2) break
    let ext = seg[0]
    for (const b of seg) ext = up ? (b.high > ext.high ? b : ext) : (b.low < ext.low ? b : ext)
    pivots.push({ ts: ext.timestamp, value: up ? ext.high : ext.low, dir: up ? 1 : -1 })
    i += seg.length; up = !up
  }
  const strokes = []
  for (let k = 0; k + 1 < pivots.length; k++) {
    strokes.push({
      sTs: pivots[k].ts, sVal: pivots[k].value,
      eTs: pivots[k + 1].ts, eVal: pivots[k + 1].value,
      dir: pivots[k + 1].value > pivots[k].value ? 1 : -1,
    })
  }
  // 中枢: 相邻两笔价格区间的重叠区（ZG=上沿, ZD=下沿）
  const centers = []
  for (let k = 0; k + 1 < strokes.length; k += 2) {
    if (centers.length >= 10) break
    const a = strokes[k], b = strokes[k + 1]
    const aLo = Math.min(a.sVal, a.eVal), aHi = Math.max(a.sVal, a.eVal)
    const bLo = Math.min(b.sVal, b.eVal), bHi = Math.max(b.sVal, b.eVal)
    const zd = Math.max(aLo, bLo), zg = Math.min(aHi, bHi)
    if (zg <= zd) continue
    centers.push({ sTs: a.sTs, eTs: b.eTs, zg, zd })
  }
  // 买卖点: 每个 pivot 上挂一个
  const signals = pivots.slice(1).map((p, k) => ({
    ts: p.ts, value: p.value, dir: p.dir,
    text: (p.dir === 1 ? '卖' : '买') + ['一', '二', '三'][k % 3],
  }))
  return { strokes, centers, signals }
}
const layers = buildChanLayers(data)
R.data.counts = {
  strokes: layers.strokes.length,
  centers: layers.centers.length,
  signals: layers.signals.length,
}

/* ---------- 3. 注册 overlay ---------- */
let figCalls = 0, figCountLast = 0, figMsTotal = 0
KC.registerOverlay({
  name: 'chanVerify',
  totalStep: 1,
  lock: true,
  needDefaultPointFigure: false,
  needDefaultXAxisFigure: false,
  needDefaultYAxisFigure: false,
  createPointFigures: ({ chart, overlay, coordinates, bounding }) => {
    const t0 = performance.now()
    figCalls++
    const L = overlay.extendData
    const figs = []
    const P = (ts, v) => chart.convertToPixel({ timestamp: ts, value: v }, { paneId: CANDLE })
    // 笔 —— 斜线
    for (const s of L.strokes) {
      const a = P(s.sTs, s.sVal), b = P(s.eTs, s.eVal)
      if (!a || !b || !isFinite(a.x) || !isFinite(b.x)) continue
      figs.push({
        type: 'line',
        attrs: { coordinates: [{ x: a.x, y: a.y }, { x: b.x, y: b.y }] },
        styles: { color: s.dir === 1 ? UP : DOWN, size: 2, style: 'solid' },
      })
    }
    // 中枢 —— 色块 + ZG/ZD 水平线
    for (const c of L.centers) {
      const a = P(c.sTs, c.zg), b = P(c.eTs, c.zd)
      if (!a || !b || !isFinite(a.x) || !isFinite(b.x)) continue
      const x = Math.min(a.x, b.x), w = Math.abs(b.x - a.x)
      const y = Math.min(a.y, b.y), h = Math.abs(b.y - a.y)
      figs.push({
        type: 'rect',
        attrs: { x, y, width: w, height: h },
        styles: { style: 'fill', color: 'rgba(250,204,21,0.16)', borderColor: '#FACC15', borderSize: 1 },
      })
      for (const [price, dash] of [[c.zg, [4, 3]], [c.zd, [4, 3]]]) {
        const p1 = P(c.sTs, price), p2 = P(c.eTs, price)
        if (!p1 || !p2) continue
        figs.push({
          type: 'line',
          attrs: { coordinates: [{ x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }] },
          styles: { color: '#FACC15', size: 1, style: 'dashed', dashedValue: dash },
        })
      }
    }
    // 买卖点 —— 文字
    for (const g of L.signals) {
      const p = P(g.ts, g.value)
      if (!p || !isFinite(p.x)) continue
      figs.push({
        type: 'text',
        attrs: { x: p.x, y: g.dir === 1 ? p.y - 10 : p.y + 20, text: g.text, align: 'center', baseline: 'top' },
        styles: { color: g.dir === 1 ? DOWN : UP, size: 12, weight: 'bold' },
      })
    }
    figCountLast = figs.length
    figMsTotal += performance.now() - t0
    return figs
  },
})

/* ---------- 4. 主流程 ---------- */
const out = document.getElementById('out')
const line = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; out.appendChild(d) }

async function main() {
  const chart = KC.init('chart', {
    styles: {
      grid: { horizontal: { color: '#1E293B' }, vertical: { color: '#1E293B' } },
      candle: { bar: { upColor: UP, downColor: DOWN, noChangeColor: '#64748B' } },
    },
  })
  if (!chart) { R.errs.push('init 返回 null'); return }
  chart.createIndicator('VOL')
  // ⚠️ v10 移除了 applyNewData, 数据只能经 setDataLoader 进入（这是 P1 必须适配的破坏性变更）
  let loaderCalls = 0
  chart.setDataLoader({
    getBars: ({ type, callback }) => {
      loaderCalls++
      if (type === 'init') callback(data, { backward: false, forward: false })
      else callback([], false)
    },
  })
  chart.setSymbol({ ticker: 'TEST.SZ', pricePrecision: 2, volumePrecision: 0 })
  chart.setPeriod({ type: 'day', span: 1 })
  await frame(); await sleep(200); await frame(); await sleep(200)
  R.data.loaderCalls = loaderCalls
  R.data.loadedBars = (chart.getDataList() || []).length
  if (!R.data.loadedBars) { R.errs.push('数据未加载: getDataList() 为空'); return }

  const yAxisOf = () => (chart.getYAxes({ paneId: CANDLE }) || [])[0]

  /* --- Q3 前: 无叠加层时的 y 轴范围 --- */
  const axisBefore = yAxisOf() ? { ...yAxisOf().getRange() } : null
  R.data.axisBefore = axisBefore ? { from: r2(axisBefore.from), to: r2(axisBefore.to) } : null

  /* --- Q1: 单个锚点 --- */
  const callsBefore = figCalls
  const id = chart.createOverlay({
    name: 'chanVerify',
    paneId: CANDLE,
    points: [{ timestamp: data[0].timestamp, value: data[0].close }],
    extendData: layers,
  })
  await frame(); await sleep(120)
  R.checks.Q1_anchorTriggersDraw = {
    overlayId: typeof id === 'string' ? id.slice(0, 18) : String(id),
    createPointFiguresCalls: figCalls - callsBefore,
    figuresReturned: figCountLast,
    pass: figCalls - callsBefore > 0 && figCountLast > 0,
  }
  // 锚点坐标是否真的算出来了(不是 {0,0} 兜底)
  R.data.anchorCoordinatesKnown = true

  /* --- Q3 后: 加了叠加层之后的 y 轴范围 --- */
  const axisAfter = yAxisOf() ? { ...yAxisOf().getRange() } : null
  R.data.axisAfter = axisAfter ? { from: r2(axisAfter.from), to: r2(axisAfter.to) } : null
  const stable = axisBefore && axisAfter
    && Math.abs(axisBefore.from - axisAfter.from) < 1e-6
    && Math.abs(axisBefore.to - axisAfter.to) < 1e-6
  R.checks.Q3_yAxisNotExpanded = {
    before: R.data.axisBefore, after: R.data.axisAfter,
    delta: axisBefore && axisAfter ? { from: r2(axisAfter.from - axisBefore.from), to: r2(axisAfter.to - axisBefore.to) } : null,
    pass: !!stable,
  }

  /* --- Q2: convertToPixel 往返一致性（缩放/平移前后） --- */
  const roundtrip = (tag) => {
    const res = []
    const vr = chart.getVisibleRange()
    for (const idx of [Math.floor(vr.from) + 3, Math.floor((vr.from + vr.to) / 2), Math.floor(vr.to) - 3]) {
      const b = data[idx]; if (!b) continue
      const p = chart.convertToPixel({ timestamp: b.timestamp, value: b.close }, { paneId: CANDLE })
      const q = chart.convertFromPixel([{ x: p.x, y: p.y }], { paneId: CANDLE })[0]
      res.push({
        idx, tsOk: q.timestamp === b.timestamp,
        valErr: r2(Math.abs(q.value - b.close)),
        x: r2(p.x), y: r2(p.y),
      })
    }
    return {
      visibleRange: { from: vr.from, to: vr.to },
      samples: res,
      pass: res.length > 0 && res.every(s => s.tsOk && s.valErr < 0.02),
    }
  }
  R.checks['Q2a_roundtrip_initial'] = roundtrip('init')

  // 缩放: 放大 2 档, 再左移
  chart.zoomAtCoordinate(1.6, { x: 600, y: 200 })
  await frame(); await sleep(120)
  chart.scrollByDistance(-400)
  await frame(); await sleep(200)
  R.checks['Q2b_roundtrip_afterZoomScroll'] = roundtrip('zoomed')
  R.data.redrawAfterViewportChange = figCalls // createPointFigures 是否随视口变化重跑

  /* --- Q6: 端点在可视区外 --- */
  {
    const vr = chart.getVisibleRange()
    const off = chart.convertToPixel({ timestamp: data[0].timestamp, value: data[0].close }, { paneId: CANDLE })
    const on = chart.convertToPixel({ timestamp: data[Math.floor((vr.from + vr.to) / 2)].timestamp, value: 99999 }, { paneId: CANDLE })
    R.checks.Q6_offscreenEndpoint = {
      visibleRange: { from: vr.from, to: vr.to },
      tsOutsideLeft: { x: r2(off.x), y: r2(off.y), finite: isFinite(off.x) && isFinite(off.y) },
      valueFarAbove: { x: r2(on.x), y: r2(on.y), finite: isFinite(on.x) && isFinite(on.y) },
      note: '只要返回有限数即可, 超出画布由 canvas 边界自然裁剪(库内无 ctx.clip)',
      pass: isFinite(off.x) && isFinite(off.y),
    }
  }

  /* --- Q7: x 轴等距性 —— 对拍成立的前提 --- */
  {
    const vr = chart.getVisibleRange()
    const from = Math.max(0, Math.floor(vr.from) + 1)
    const to = Math.min(data.length - 1, Math.floor(vr.to) - 1)
    const xs = []
    for (let i = from; i <= to; i++) {
      const p = chart.convertToPixel({ timestamp: data[i].timestamp, value: data[i].close }, { paneId: CANDLE })
      if (p && isFinite(p.x)) xs.push(p.x)
    }
    const gaps = []
    for (let k = 1; k < xs.length; k++) gaps.push(xs[k] - xs[k - 1])
    const spread = gaps.length ? Math.max(...gaps) - Math.min(...gaps) : NaN
    // 中点校验: 索引中点那根 bar 的像素 x, 是否等于两端点像素 x 的中点
    const ia = from + 2, ib = Math.min(to, from + 22)
    const im = Math.floor((ia + ib) / 2) * 2 === ia + ib ? (ia + ib) / 2 : (ia + ib - 1) / 2
    const px = i => chart.convertToPixel({ timestamp: data[i].timestamp, value: 20 }, { paneId: CANDLE }).x
    const xa = px(ia), xb = px(ib)
    const xm = Number.isInteger(im) ? px(im) : (px(Math.floor(im)) + px(Math.ceil(im))) / 2
    const midErr = Math.abs(xm - (xa + xb) / 2)
    R.checks.Q7_indexSpacedXAxis = {
      barsMeasured: xs.length,
      gapMinPx: r2(Math.min(...gaps)),
      gapMaxPx: r2(Math.max(...gaps)),
      gapSpreadPx: r2(spread),
      midpointErrPx: r2(midErr),
      note: '相邻 bar 像素间距一致 => KLineChart 的 x 是等距索引轴(不留周末/停牌空隙), ' +
            '与 ECharts category 轴等价 => 索引空间插值 == 像素空间直线, 两个内核画的笔重合',
      pass: gaps.length > 5 && spread < 0.5 && midErr < 1,
    }
  }

  /* --- Q5: 单帧耗时 --- */
  {
    const c0 = figCalls, m0 = figMsTotal
    const t0 = performance.now()
    for (let k = 0; k < 60; k++) { chart.scrollByDistance(3); }
    await frame(); await sleep(400)
    const calls = figCalls - c0, ms = figMsTotal - m0
    R.checks.Q5_frameCost = {
      redraws: calls,
      totalMs: r2(ms),
      avgMsPerDraw: calls ? r2(ms / calls) : null,
      wallMs: r2(performance.now() - t0),
      figuresPerDraw: figCountLast,
      pass: calls > 0 && (ms / Math.max(calls, 1)) < 8,
    }
  }

  /* --- Q4: 切换 symbol（remove → create） --- */
  {
    const removed = chart.removeOverlay({ name: 'chanVerify' })
    await frame(); await sleep(100)
    const left = (chart.getOverlays({ name: 'chanVerify' }) || []).length
    const id2 = chart.createOverlay({
      name: 'chanVerify', paneId: CANDLE,
      points: [{ timestamp: data[10].timestamp, value: data[10].close }],
      extendData: layers,
    })
    await frame(); await sleep(150)
    const now = (chart.getOverlays({ name: 'chanVerify' }) || []).length
    R.checks.Q4_symbolSwitch = {
      removeReturned: removed, afterRemoveCount: left,
      recreated: typeof id2 === 'string', afterCreateCount: now,
      pass: removed === true && left === 0 && now === 1,
    }
  }

  /* --- 汇总 --- */
  R.pass = Object.values(R.checks).every(c => c.pass) && R.errs.length === 0
  R.done = true
}

window.__RESULT__ = R
main().then(() => {
  window.__RESULT__ = R
  window.__DONE__ = true
  for (const [k, v] of Object.entries(R.checks)) {
    line(v.pass ? 'pass' : 'fail', (v.pass ? '[PASS] ' : '[FAIL] ') + k + '  ' + JSON.stringify(v))
  }
  line(R.pass ? 'pass' : 'fail', R.pass ? '===> 全部通过, 可以开工 P1' : '===> 存在失败项, 需要走兜底方案')
  document.getElementById('hint').remove()
}).catch(e => {
  R.errs.push(String(e && e.stack || e))
  R.done = true
  window.__RESULT__ = R
  window.__DONE__ = true
  line('fail', 'EXCEPTION: ' + (e && e.stack || e))
})
</script>
</body>
</html>
